# Deploy ExamTrack to EC2 on push to main or manual run.
name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build

            # Wait for the backend stack to be ready
            
            echo "Waiting for /api/health..."

            for i in $(seq 1 30); do
              # Hit backend directly (Caddy may redirect :80 → https)
              if curl -fsS http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
                echo "Health check passed on attempt $i"
                curl -fsS http://127.0.0.1:5000/api/health
                exit 0
              fi
              echo "Attempt $i/30 — not ready yet, retrying in 5s..."
              sleep 5
            done
            echo "Health check failed after 30 attempts (~150s)"
            docker compose ps
            docker compose logs ermis-backend --tail=40
            docker compose logs ermis-caddy --tail=40
            exit 1

